<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · Autos Colombia</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body class="login">
<form class="box" method="post" autocomplete="off">
  <h1>Autos <span>Colombia</span></h1>
  <p>Ingresa con tu usuario del sistema</p>
  {% for categoria, mensaje in get_flashed_messages(with_categories=true) %}
  <div class="alert {{ categoria }}">{{ mensaje }}</div>
  {% endfor %}
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <div class="fld"><label for="usuario">Usuario</label>
    <input class="inp" id="usuario" name="usuario" value="{{ usuario }}" autofocus required></div>
  <div class="fld"><label for="clave">Contraseña</label>
    <input class="inp" id="clave" name="clave" type="password" required></div>
  <div style="height:6px"></div>
  <button class="btn p" type="submit" style="width:100%">Ingresar</button>
  <p class="pie">Si olvidaste tu contraseña habla con el administrador</p>
</form>
</body>
</html>
